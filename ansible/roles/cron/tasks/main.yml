# Debian/Ubuntu use their own 'cron' package; Arch and Fedora use cronie.
# The systemd unit name differs per distro too.
- name: Cron | Install cron
  ansible.builtin.apt:
    name: cron
    state: present
  become: true
  when: machine_os == 'debian'

- name: Cron | Install cronie
  community.general.pacman:
    name: cronie
    state: present
  become: true
  when: machine_os == 'archlinux'

- name: Cron | Install cronie
  ansible.builtin.dnf:
    name: cronie
    state: present
  become: true
  when: machine_os == 'redhat'

# - name: Cron | Activate cronjobs (crontab)
#   ansible.builtin.cron:
#     name: cronie
#     state: present
#   become: true

- name: Cron | Start and Enable cron service
  ansible.builtin.systemd:
    name: "{{ {'debian': 'cron', 'archlinux': 'cronie', 'redhat': 'crond'}[machine_os] }}"
    enabled: true
    state: started
  become: true
