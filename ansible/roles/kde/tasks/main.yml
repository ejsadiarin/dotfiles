---
# Script owns everything: symlinks for portable files + kwriteconfig6 for
# kwinrc/kglobalshortcutsrc. Ansible just executes it.

- name: KDE | Check for kwriteconfig6 (Plasma installed)
  ansible.builtin.command: command -v kwriteconfig6
  register: kde_kwriteconfig
  failed_when: false
  changed_when: false

- name: KDE | Apply KDE configs (idempotent script)
  ansible.builtin.command:
    cmd: "{{ ansible_facts['user_dir'] }}/dotfiles/kde/apply-kde-config.sh"
  register: kde_apply
  changed_when: false
  failed_when: kde_apply.rc != 0
  become: false
  when: kde_kwriteconfig.rc == 0
