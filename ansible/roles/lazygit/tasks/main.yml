---
- name: LazyGit | Install LazyGit via go install for debian
  ansible.builtin.command: "/usr/local/go/bin/go install github.com/jesseduffield/lazygit@latest"
  args:
    creates: "{{ ansible_facts['user_dir'] }}/go/bin/lazygit"
  environment:
    PATH: "/usr/local/go/bin:{{ ansible_facts['env']['PATH'] }}"
  when: machine_os == 'debian'

- name: LazyGit | Install LazyGit for archlinux
  community.general.pacman:
    name: lazygit
    state: present
  become: true
  when: machine_os == 'archlinux'

- name: LazyGit | Add LazyGit repo via copr for redhat
  community.general.copr:
    host: copr.fedorainfracloud.org
    name: atim/lazygit
    state: enabled
  become: true
  when: machine_os == 'redhat'

- name: LazyGit | Install LazyGit for redhat
  ansible.builtin.dnf:
    name: lazygit
    state: present
  become: true
  when: machine_os == 'redhat'
