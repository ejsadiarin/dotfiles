---
- name: OpenCode | Install via curl
  ansible.builtin.shell: "curl -fsSL https://opencode.ai/install | bash"
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.opencode/bin/opencode"

- name: OpenCode | Ensure ~/.config/opencode directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/opencode"
    state: directory
    mode: "0755"

- name: OpenCode | Remove existing opencode.json if present
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/opencode/opencode.json"
    state: absent

- name: OpenCode | Remove existing tui.json if present
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/opencode/tui.json"
    state: absent

- name: OpenCode | Link opencode.jsonc to .config/opencode/opencode.jsonc
  ansible.builtin.file:
    src: "{{ ansible_facts['user_dir'] }}/dotfiles/config/opencode/opencode.jsonc"
    dest: "{{ ansible_facts['user_dir'] }}/.config/opencode/opencode.jsonc"
    state: link

- name: OpenCode | Link cli.json to .config/opencode/cli.json
  ansible.builtin.file:
    src: "{{ ansible_facts['user_dir'] }}/dotfiles/config/opencode/cli.json"
    dest: "{{ ansible_facts['user_dir'] }}/.config/opencode/cli.json"
    state: link

- name: OpenCode | Link dcp.json to .config/opencode/dcp.json
  ansible.builtin.file:
    src: "{{ ansible_facts['user_dir'] }}/dotfiles/config/opencode/dcp.json"
    dest: "{{ ansible_facts['user_dir'] }}/.config/opencode/dcp.json"
    state: link

- name: OpenCode | Remove existing skills directory if present
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/opencode/skills"
    state: absent

- name: OpenCode | Link skills directory
  ansible.builtin.file:
    src: "{{ ansible_facts['user_dir'] }}/dotfiles/config/opencode/skills"
    dest: "{{ ansible_facts['user_dir'] }}/.config/opencode/skills"
    state: link

- name: OpenCode | Remove existing AGENTS.md if present
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/opencode/AGENTS.md"
    state: absent

- name: OpenCode | Link AGENTS.md
  ansible.builtin.file:
    src: "{{ ansible_facts['user_dir'] }}/dotfiles/config/opencode/AGENTS.md"
    dest: "{{ ansible_facts['user_dir'] }}/.config/opencode/AGENTS.md"
    state: link

# Third-party skills into ~/.agents/skills (MCP servers are in opencode.jsonc).
- name: OpenCode | Install third-party skills
  ansible.builtin.command: "{{ ansible_facts['user_dir'] }}/dotfiles/install-skills-opencode"
  register: opencode_skills
  changed_when: "'cloning' in opencode_skills.stderr"
