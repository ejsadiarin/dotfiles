---
- name: OpenCode | Check if pnpm is available
  ansible.builtin.command: which pnpm
  register: pnpm_check
  ignore_errors: true
  changed_when: false

- name: OpenCode | Get pnpm global bin dir
  ansible.builtin.command: "pnpm config get global-bin-dir"
  register: pnpm_global_bin_dir
  changed_when: false
  failed_when: false
  when: pnpm_check.rc == 0

- name: OpenCode | Set pnpm global bin dir (fixes ERR_PNPM_NO_GLOBAL_BIN_DIR)
  ansible.builtin.command: "pnpm config set global-bin-dir {{ ansible_facts['user_dir'] }}/.local/share/pnpm"
  when: pnpm_check.rc == 0 and pnpm_global_bin_dir.stdout | trim != ansible_facts['user_dir'] + '/.local/share/pnpm'

- name: OpenCode | Install via pnpm
  ansible.builtin.shell: "pnpm add -g opencode-ai"
  # pnpm requires the global bin dir on PATH; ansible shells don't source .zshrc
  environment:
    PNPM_HOME: "{{ ansible_facts['user_dir'] }}/.local/share/pnpm"
    PATH: "{{ ansible_facts['user_dir'] }}/.local/share/pnpm:{{ ansible_env.PATH }}"
  when: pnpm_check.rc == 0

- name: OpenCode | Install via curl (fallback when no pnpm)
  ansible.builtin.shell: "curl -fsSL https://opencode.ai/install | bash"
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.opencode/bin/opencode"
  when: pnpm_check.rc != 0

- name: OpenCode | Ensure ~/.config/opencode directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/opencode"
    state: directory
    mode: "0755"

- name: OpenCode | Remove existing opencode.json if present
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/opencode/opencode.json"
    state: absent

- name: OpenCode | Link opencode.jsonc to opencode.jsonc
  ansible.builtin.file:
    src: "{{ ansible_facts['user_dir'] }}/dotfiles/config/opencode/opencode.jsonc"
    dest: "{{ ansible_facts['user_dir'] }}/.config/opencode/opencode.jsonc"
    state: link

- name: OpenCode | Link tui.json to tui.json
  ansible.builtin.file:
    src: "{{ ansible_facts['user_dir'] }}/dotfiles/config/opencode/tui.json"
    dest: "{{ ansible_facts['user_dir'] }}/.config/opencode/tui.json"
    state: link

- name: OpenCode | Link dcp.jsonc to dcp.jsonc
  ansible.builtin.file:
    src: "{{ ansible_facts['user_dir'] }}/dotfiles/config/opencode/dcp.jsonc"
    dest: "{{ ansible_facts['user_dir'] }}/.config/opencode/dcp.jsonc"
    state: link

- name: OpenCode | Remove existing skills directory if present
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/opencode/skills"
    state: absent

- name: OpenCode | Link skills directory
  ansible.builtin.file:
    src: "{{ ansible_facts['user_dir'] }}/dotfiles/config/opencode/skills"
    dest: "{{ ansible_facts['user_dir'] }}/.config/opencode/skills"
    state: link

- name: OpenCode | Remove existing AGENTS.md if present
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/opencode/AGENTS.md"
    state: absent

- name: OpenCode | Link AGENTS.md
  ansible.builtin.file:
    src: "{{ ansible_facts['user_dir'] }}/dotfiles/config/opencode/AGENTS.md"
    dest: "{{ ansible_facts['user_dir'] }}/.config/opencode/AGENTS.md"
    state: link
