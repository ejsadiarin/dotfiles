set -g status-right '#[fg=#{@exquisite_aqua}]#[bg=default]#(~/.config/tmux/scripts/tmux-agent-count) #[fg=#{@exquisite_red}]#[bg=default] #(date +"%Y-%h-%d %I:%M %p") '

set -g pane-border-style "fg=#6b7678,bg=default"
set -g pane-active-border-style "fg=#f9e2af,bg=default"

#################
#    PLUGINS    #
#################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

run ~/.config/tmux/plugins/tpm/tpm

# set vi-mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi Escape send-keys -X clear-selection
# builtin
# bind-key -T copy-mode-vi q send-keys -X cancel
# bind-key -T copy-mode-vi C-c send-keys -X cancel
bind-key -n M-[ copy-mode

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R
bind-key -T copy-mode-vi 'M-\' select-pane -l

###########################
#    NESTED REMOTE TMUX   #
###########################
# On a remote host (local tmux -> ssh -> remote tmux), also bind Alt-Shift-*
# versions of the Alt-* keys. The local tmux binds no Alt-Shift keys, so they
# pass through the ssh pane to the remote tmux. Alt-* still works on the remote
# when there's no local tmux in front of it.
%if "#{!=:$SSH_CONNECTION,}"
bind -n M-BTab last-window
bind -n M-W switch-client -l
bind -n M-O command-prompt -p "Send pane to window:" "run-shell '~/.config/tmux/scripts/tmux-smart-join %%'"
bind -n M-N previous-window
bind -n M-P next-window

# vim gets the plain Alt-{h,j,k,l} its navigator mappings expect
bind -n M-H if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n M-J if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n M-K if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n M-L if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

bind -n M-X run-shell ~/.config/tmux/scripts/tmux-safe-kill-pane
bind -n M-T run-shell ~/.config/tmux/scripts/split
bind -n M-D run-shell "tmux neww ~/.config/tmux/scripts/tmux-sessionizer"
bind -n M-S run-shell "tmux neww ~/.config/tmux/scripts/tmux-active-sessions"
bind -n M-Q run-shell "tmux neww ~/.config/tmux/scripts/tmux-delete-sessions-fzf"
bind -n M-A run-shell "tmux neww bash ~/.config/tmux/scripts/tmux-agent-status --select"
bind -n 'M-{' copy-mode

bind -T copy-mode-vi M-H select-pane -L
bind -T copy-mode-vi M-J select-pane -D
bind -T copy-mode-vi M-K select-pane -U
bind -T copy-mode-vi M-L select-pane -R
bind -T copy-mode-vi 'M-|' select-pane -l
%endif
